services:
  db:
    image: postgres:16-alpine
    container_name: school_admission_db
    restart: always
    environment:
      POSTGRES_DB: school_admission
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d school_admission"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: school_admission_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=Host=db;Port=5432;Database=school_admission;Username=postgres;Password=postgrespassword
      - HOLD_DURATION_SECONDS=600
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: school_admission_frontend
    restart: always
    ports:
      - "3000:80"
    environment:
      - VITE_BACKEND_URL=http://localhost:8080
    depends_on:
      - backend

volumes:
  postgres_data: